aid: art
name: Artsy
description: >-
  Artsy (art.sy) is the online marketplace and platform for discovering, buying, and selling fine
  art, connecting collectors with galleries, museums, art fairs, and auction houses worldwide.
  Artsy operates a public developer program: the Artsy Public API (v2) is a HAL hypermedia REST
  API exposing Artsy's database of artists, artworks, genes (the Art Genome Project's classification
  of artistic characteristics), gallery and museum shows, partners, art fairs, and auction sales.
  Authentication uses an application-level X-Xapp-Token minted by exchanging a client_id and
  client_secret. Artsy also runs the Metaphysics GraphQL API that powers its own web and mobile
  apps. Artsy has announced that the public REST API is being retired and may be taken down without
  notice; the Partner API remains available to approved partners. Surfaced as a slow-ventures
  portfolio company and enriched by the API Evangelist pipeline from Artsy's live API and docs.
